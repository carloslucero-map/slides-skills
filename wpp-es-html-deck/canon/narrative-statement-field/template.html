<!-- canon/narrative-statement-field — traced from bank slide 14 (measure.json, ref.png).

     THE PUNCTUATION SLIDE. One sentence, centred, at poster size, over a
     full-bleed halftone dot field. It is not making an argument — it is marking
     the turn between two, and it works precisely because there is nothing else
     on it.

     Distinct from the kit's statement slides, which are all left-aligned with
     art to one side. Here the axis is central and the texture runs edge to
     edge behind the type, so the statement sits IN the field rather than beside
     something. statement-quote-v3 is the navy poster for a hard full stop; this
     is the cream one for a breath.

     THE TYPE IS THE ONLY ELEMENT. No eyebrow, no takeaway, no page furniture
     beyond the required footer. Adding a subtitle is the commonest way to ruin
     this slide: the moment there are two things to read, it stops being a pause.

     The field is a §5 dot motif at low opacity, not an image. It has to stay
     under the §3.5 contrast floor's comfortable side — the statement is navy on
     cream and the texture must never close that gap.
-->
<section class="slide" data-slide-id="cX-sY" data-archetype="narrative-statement-field" data-template="narrative-statement-field">

  <div class="nsf-field" data-motif="orbs" data-text-safe="true" aria-hidden="true"></div>
  <p class="nsf-line">And that is why we see loyalty as an <span class="hl">enterprise strategy</span></p>

  <div class="footer-brand">WPP Enterprise Solutions | MAP</div>
  <div class="pageno"></div>

  <style>
  /* Measured off slide 14. */

  /* Edge to edge, and deliberately faint. The statement is navy on cream and the
     texture must never narrow that contrast — §3.5 governs, not taste. It carries
     data-text-safe because the type sits over it by design; the declaration is a
     claim about intent, and it is only honest while the opacity stays this low. */
  .nsf-field{position:absolute;inset:0;overflow:hidden;opacity:.5;}
  .nsf-field img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Central axis, and the only element. A subtitle here is the commonest way to
     ruin the slide: two things to read stops it being a pause. */
  .nsf-line{position:absolute;left:12%;right:12%;top:50%;transform:translateY(-50%);
            margin:0;text-align:center;
            font-weight:300;font-size:104px;line-height:1.02;letter-spacing:-.01em;
            text-transform:uppercase;text-wrap:balance;}
  </style>
</section>
